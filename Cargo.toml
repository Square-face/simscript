[package]
name = "simscript"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["ui"]


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1


# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
codegen-units = 1
opt-level = 3
# panic = "abort"
lto = "fat"


[dependencies]
bevy = { version = "0.15.0" }
bevy_infinite_grid = "0.13.1"
simscript-physics = { git = "https://github.com/Square-face/simscript-physics", branch = "main" }
# simscript-physics = { path = "../simscript-physics" }
ui = { path = "./ui/" }
chrono = "0.4.39"
rayon = "1.10.0"

[dev-dependencies]
bevy = { version = "0.15.0", features = ["dynamic_linking"] }

[dependencies.log]
version = "*"
features = [
    "max_level_debug",
    "release_max_level_warn", # Remove trace logging at compile time
]
