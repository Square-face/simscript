[package]
name = "physics"
version = "0.1.0"
edition = "2021"

[dependencies]
glam = "0.29.2"
float-cmp = "0.9.0"
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] } # Remove trace logging at compile time
overload = "0.1.1"

bevy = { version = "0.15.0", optional=true }

[features]
bevy_components = ["bevy"]
